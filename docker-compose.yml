# docker compose up                      serve an OpenAI-compatible API on http://localhost:${PORT:-8000}/v1 (first start downloads and builds, later starts take about a minute)
# docker compose run --rm bench          time the running server on a recorded workload, HumanEval and long prompts, and print the table
# docker compose --profile compare run --rm compare   the full side-by-side with stock NVIDIA TensorRT-Edge-LLM (builds both stacks; hours)
# Settings (.env or environment): MODEL, PROFILE, PORT, HF_TOKEN (gated models only), see .env.example
name: faster-llm-poc

x-poc: &poc
  image: faster-llm-poc:${PROFILE:-dgpu}
  runtime: nvidia
  shm_size: 8g
  ipc: host
  environment:
    PROFILE: ${PROFILE:-dgpu}
    MODEL: ${MODEL:-qwen36-35b}
    HF_TOKEN: ${HF_TOKEN:-}
    HF_ONNX_REPO: ${HF_ONNX_REPO:-}
    QUANTIZE: ${QUANTIZE:-0}
    ONNX_MIRROR_URL: ${ONNX_MIRROR_URL:-}
    ONNX_DIR: ${ONNX_DIR:-}
    CACHE_BIAS: ${CACHE_BIAS:-0.5}
    TAIL_SKIP: ${TAIL_SKIP:-0}
    CPU_MISS: ${CPU_MISS:-1}
    CPU_ADMIT: ${CPU_ADMIT:-16}
    CPU_INT8: ${CPU_INT8:-1}
    CPU_THREADS: ${CPU_THREADS:-6}
    CPU_CORES: ${CPU_CORES:-auto}
    BENCH_CALLS: ${BENCH_CALLS:-60}
    BENCH_HUMANEVAL: ${BENCH_HUMANEVAL:-164}
    BENCH_LONGCTX: ${BENCH_LONGCTX-__default__}
    BENCH_ROUNDS: ${BENCH_ROUNDS:-2}
    PORT: ${PORT:-8000}
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  volumes:
    - ${DATA_DIR:-./data}:/data

services:
  serve:
    <<: *poc
    build:
      context: .
      args:
        PROFILE: ${PROFILE:-dgpu}
        GPU_ARCH: ${GPU_ARCH:-}
        BUILD_JOBS: ${BUILD_JOBS:-8}
    command: up
    restart: "on-failure:3"
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${PORT:-8000}/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 3h        # the first start downloads and builds

  bench:
    <<: *poc
    profiles: ["bench"]
    command: bench
    restart: "no"
    environment:
      PROFILE: ${PROFILE:-dgpu}
      MODEL: ${MODEL:-qwen36-35b}
      BENCH_URL: ${BENCH_URL:-http://serve:${PORT:-8000}}
      BENCH_LABEL: ${BENCH_LABEL:-fast}
      BENCH_CALLS: ${BENCH_CALLS:-60}
      BENCH_HUMANEVAL: ${BENCH_HUMANEVAL:-164}
      BENCH_LONGCTX: ${BENCH_LONGCTX-__default__}
      PORT: ${PORT:-8000}
    depends_on:
      serve:
        condition: service_healthy

  compare:
    <<: *poc
    profiles: ["compare"]
    image: faster-llm-poc:${PROFILE:-dgpu}-compare
    build:
      context: .
      args:
        PROFILE: ${PROFILE:-dgpu}
        GPU_ARCH: ${GPU_ARCH:-}
        BUILD_JOBS: ${BUILD_JOBS:-8}
        WITH_STOCK: "1"
    command: all
    restart: "no"
