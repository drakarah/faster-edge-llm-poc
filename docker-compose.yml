# docker compose up
#   builder  downloads the model, quantises it, builds the optimised engine and lets the stock stack build its own (hours on first run)
#   bench    times stock Edge-LLM and the optimised fork alternately on the same prompts and prints the comparison
#   serve    keeps the optimised server up on http://localhost:${PORT:-8000}/v1 (OpenAI API)
# Settings (.env or environment): PROFILE=orin|dgpu, MODEL=gemma4-e4b|gemma4-12b|qwen35-4b, HF_TOKEN (Gemma is gated), see .env.example
name: faster-llm-poc

x-poc: &poc
  image: faster-llm-poc:${PROFILE:-orin}
  runtime: nvidia
  shm_size: 8g
  ipc: host
  environment:
    PROFILE: ${PROFILE:-orin}
    MODEL: ${MODEL:-gemma4-e4b}
    HF_TOKEN: ${HF_TOKEN:-}
    BENCH_CALLS: ${BENCH_CALLS:-60}
    BENCH_HUMANEVAL: ${BENCH_HUMANEVAL:-164}
    BENCH_LONGCTX: ${BENCH_LONGCTX-__default__}
    BENCH_ROUNDS: ${BENCH_ROUNDS:-2}
    PORT: ${PORT:-8000}
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  volumes:
    - ${DATA_DIR:-./data}:/data

services:
  builder:
    <<: *poc
    build:
      context: .
      args:
        PROFILE: ${PROFILE:-orin}
        GPU_ARCH: ${GPU_ARCH:-}
        BUILD_JOBS: ${BUILD_JOBS:-8}
    command: builder
    restart: "no"

  bench:
    <<: *poc
    command: bench
    restart: "no"
    depends_on:
      builder:
        condition: service_completed_successfully

  serve:
    <<: *poc
    command: serve
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      bench:
        condition: service_completed_successfully
